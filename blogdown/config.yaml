baseurl: "https://baptiste-genest.github.io/"
languageCode: "en-us"
title: "Baptiste Genest website"
author: "Baptiste Genest"
description: "This is the personal webpage of Baptiste Genest."
theme: "hugo-xmin"
googleAnalytics: ""
disqusShortname: ""
ignoreFiles: ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
footnotereturnlinkcontents: "↩"
publishDir: "../../baptiste-genest.github.io"
enableRobotsTXT: true
# no tags/categories are used; these generated empty pages are thin content for search engines
disableKinds: ["taxonomy", "term"]

permalinks:
  note: "/note/:year/:month/:day/:slug/"
  post: "/post/:year/:month/:day/:slug/"

menu:
  main:
    - name: About
      url: ""
      weight: 1
    - name: Publications
      url: "publications/"
      weight: 2
    - name: Software
      url: "software/"
      weight: 3
    - name: Teaching
      url: "teaching/"
      weight: 4
    - name: Projects
      url: "projects/"
      weight: 5
    - name: Talks
      url: "talks/"
      weight: 6
    - name: 😻 Toffee 😻
      url: "toffee/"
      weight: 7
    - name: Tribute
      url: "people/"
      weight: 8

params:
  description: "Personal webpage of Baptiste Genest."
  # GoatCounter site code, i.e. the CODE in https://CODE.goatcounter.com
  # Leave empty to disable analytics entirely (no script is emitted).
  goatcounter: "baptistegenest"
  footer: "[Github](https://github.com/baptiste-genest) | [Bluesky](https://bsky.app/profile/baptiste-genest.bsky.social) | [Scholar](https://scholar.google.com/citations?user=4gYLnGsAAAAJ&hl=fr) | Hugo Theme by [Yihui Xie](https://yihui.org/)"

markup:
  highlight:
    codeFences: false
  goldmark:
    renderer:
      unsafe: true
