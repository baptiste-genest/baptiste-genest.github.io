<script>let nb_imgs = 47;

const shuffledArray = Array.from(
    { length: nb_imgs },
    (_, i) => i + 1
);

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

shuffle(shuffledArray);

let id = 0;

function loadRandomImage() {
    if (id >= nb_imgs) {
        id = 0;
    }

    const randomIndex = shuffledArray[id++];
    document.getElementById('randomImage').src =
        `../toffee/toffee_${randomIndex}.jpg`;
}

loadRandomImage();

document
    .getElementById('loadImageButton')
    .addEventListener('click', loadRandomImage);
    
</script>

<script>
document.addEventListener('click', function (e) {
  var el = e.target.closest('a[href], button[onclick]');
  if (!el) return;

  var url = el.getAttribute('href');
  if (!url) {
    var m = /window\.location\.href\s*=\s*['"]([^'"]+)['"]/.exec(el.getAttribute('onclick') || '');
    url = m && m[1];
  }
  if (!url || !/\.pdf($|[?#])/i.test(url)) return;

  
  
  var u, label;
  try {
    u = new URL(url, location.href);
    label = decodeURIComponent(u.pathname).replace(/^\/+/, '');
    if (u.host !== location.host) label = u.host + '/' + label;
  } catch (err) {
    label = url;
  }

  window.goatcounter && window.goatcounter.count && window.goatcounter.count({
    path:  'download/' + label,
    title: 'PDF: ' + label,
    event: true
  });
});
</script>
